<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Admin — Grêmio Pindorama</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0f1730;--card:#141d3d;--gold:#f5b700;--text:#eee;--muted:#9aa4c7;}
  *{box-sizing:border-box;font-family:system-ui,Arial,sans-serif;}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;}
  header{padding:16px 24px;background:var(--card);display:flex;justify-content:space-between;align-items:center;}
  h1{font-size:18px;margin:0;}
  button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-weight:bold;}
  .btn-gold{background:var(--gold);color:#141d3d;}
  .btn-out{background:transparent;border:1px solid var(--muted);color:var(--text);}
  #login-screen{max-width:360px;margin:80px auto;background:var(--card);padding:24px;border-radius:12px;}
  #login-screen input{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid var(--muted);background:#0f1730;color:#fff;}
  #app{display:none;padding:24px;max-width:900px;margin:0 auto;}
  nav{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  nav button{background:var(--card);color:var(--text);}
  nav button.active{background:var(--gold);color:#141d3d;}
  section{display:none;}
  section.active{display:block;}
  .card{background:var(--card);padding:16px;border-radius:10px;margin-bottom:12px;}
  .card input,.card textarea,.card select{width:100%;padding:8px;margin:4px 0;border-radius:6px;border:1px solid var(--muted);background:#0f1730;color:#fff;}
  .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
  .item{background:#0f1730;padding:10px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .item small{color:var(--muted);display:block;}
  .del{background:#c0392b;color:#fff;}
  #err{color:#ff6b6b;font-size:14px;min-height:18px;}
  .unread{border-left:4px solid var(--gold);}
</style>
</head>
<body>

<div id="login-screen">
  <h1>Login — Grêmio Pindorama</h1>
  <input id="email" type="email" placeholder="E-mail">
  <input id="password" type="password" placeholder="Senha">
  <div id="err"></div>
  <button class="btn-gold" style="width:100%" onclick="login()">Entrar</button>
</div>

<div id="app">
  <header>
    <h1>Painel do Grêmio Pindorama</h1>
    <button class="btn-out" onclick="logout()">Sair</button>
  </header>
  <div style="padding:24px;max-width:900px;margin:0 auto;">
    <nav>
      <button data-tab="board" class="active" onclick="showTab('board')">Diretoria</button>
      <button data-tab="videos" onclick="showTab('videos')">Vídeos</button>
      <button data-tab="news" onclick="showTab('news')">Notícias</button>
      <button data-tab="events" onclick="showTab('events')">Eventos</button>
      <button data-tab="messages" onclick="showTab('messages')">Mensagens</button>
    </nav>

    <section id="tab-board" class="active">
      <div class="card">
        <b>Novo membro</b>
        <input id="b-name" placeholder="Nome">
        <input id="b-cargo" placeholder="Cargo (ex: Tesoureiro)">
        <input id="b-photo" type="file" accept="image/*">
        <div class="row"><button class="btn-gold" onclick="addBoard()">Adicionar</button></div>
      </div>
      <div id="board-list"></div>
    </section>

    <section id="tab-videos">
      <div class="card">
        <b>Novo vídeo</b>
        <input id="v-label" placeholder="Nome do vídeo">
        <input id="v-file" type="file" accept="video/*">
        <div class="row"><button class="btn-gold" onclick="addVideo()">Adicionar</button></div>
      </div>
      <div id="videos-list"></div>
    </section>

    <section id="tab-news">
      <div class="card">
        <b>Nova notícia</b>
        <input id="n-title" placeholder="Título">
        <select id="n-category">
          <option>Avisos</option><option>Cultura</option><option>Educação</option>
          <option>Representação</option><option>Eventos</option><option>Passeios</option>
        </select>
        <textarea id="n-body" rows="3" placeholder="Texto"></textarea>
        <div class="row"><button class="btn-gold" onclick="addNews()">Publicar</button></div>
      </div>
      <div id="news-list"></div>
    </section>

    <section id="tab-events">
      <div class="card">
        <b>Novo evento</b>
        <input id="e-title" placeholder="Título">
        <input id="e-date" type="date">
        <select id="e-type"><option>Evento</option><option>Reunião</option><option>Competição</option></select>
        <textarea id="e-desc" rows="2" placeholder="Descrição"></textarea>
        <div class="row"><button class="btn-gold" onclick="addEvent()">Adicionar</button></div>
      </div>
      <div id="events-list"></div>
    </section>

    <section id="tab-messages">
      <div id="messages-list"></div>
    </section>
  </div>
</div>

<script>
const SUPABASE_URL = "https://osdhqqkvgqqutcolfxbk.supabase.co";
const SUPABASE_KEY = "sb_publishable_fsLHFO4Pah-lIZvpZDlxew_vfnpvQYB";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ document.getElementById('err').innerText = error.message; return; }
  enterApp();
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

async function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  loadBoard(); loadVideos(); loadNews(); loadEvents(); loadMessages();
}

function showTab(tab){
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelector(`nav button[data-tab="${tab}"]`).classList.add('active');
}

async function uploadFile(file, folder){
  const path = `${folder}/${Date.now()}-${file.name}`;
  const { error } = await sb.storage.from('photos').upload(path, file);
  if(error){ alert('Erro no upload: '+error.message); return null; }
  const { data } = sb.storage.from('photos').getPublicUrl(path);
  return data.publicUrl;
}

// ---- Diretoria ----
async function loadBoard(){
  const { data } = await sb.from('board_members').select('*').order('order_index');
  const el = document.getElementById('board-list'); el.innerHTML = '';
  (data||[]).forEach(m=>{
    el.innerHTML += `<div class="item"><div>${m.photo_url?`<img src="${m.photo_url}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px">`:''}<b>${m.name}</b><small>${m.cargo}</small></div><button class="del" onclick="delRow('board_members','${m.id}',loadBoard)">Excluir</button></div>`;
  });
}
async function addBoard(){
  const name = document.getElementById('b-name').value;
  const cargo = document.getElementById('b-cargo').value;
  const file = document.getElementById('b-photo').files[0];
  if(!name || !cargo) return alert('Preencha nome e cargo');
  let photo_url = null;
  if(file) photo_url = await uploadFile(file, 'board');
  await sb.from('board_members').insert({ name, cargo, photo_url });
  document.getElementById('b-name').value=''; document.getElementById('b-cargo').value='';
  loadBoard();
}

// ---- Vídeos ----
async function loadVideos(){
  const { data } = await sb.from('videos').select('*').order('order_index');
  const el = document.getElementById('videos-list'); el.innerHTML = '';
  (data||[]).forEach(v=>{
    el.innerHTML += `<div class="item"><b>${v.label}</b><button class="del" onclick="delRow('videos','${v.id}',loadVideos)">Excluir</button></div>`;
  });
}
async function addVideo(){
  const label = document.getElementById('v-label').value;
  const file = document.getElementById('v-file').files[0];
  if(!label || !file) return alert('Preencha o nome e escolha o arquivo');
  const video_url = await uploadFile(file, 'videos');
  await sb.from('videos').insert({ label, video_url });
  document.getElementById('v-label').value='';
  loadVideos();
}

// ---- Notícias ----
async function loadNews(){
  const { data } = await sb.from('news').select('*').order('created_at',{ascending:false});
  const el = document.getElementById('news-list'); el.innerHTML = '';
  (data||[]).forEach(n=>{
    el.innerHTML += `<div class="item"><div><b>${n.title}</b><small>${n.category}</small></div><button class="del" onclick="delRow('news','${n.id}',loadNews)">Excluir</button></div>`;
  });
}
async function addNews(){
  const title = document.getElementById('n-title').value;
  const category = document.getElementById('n-category').value;
  const body = document.getElementById('n-body').value;
  if(!title) return alert('Preencha o título');
  await sb.from('news').insert({ title, category, body });
  document.getElementById('n-title').value=''; document.getElementById('n-body').value='';
  loadNews();
}

// ---- Eventos ----
async function loadEvents(){
  const { data } = await sb.from('events').select('*').order('event_date');
  const el = document.getElementById('events-list'); el.innerHTML = '';
  (data||[]).forEach(ev=>{
    el.innerHTML += `<div class="item"><div><b>${ev.title}</b><small>${ev.event_date} · ${ev.event_type}</small></div><button class="del" onclick="delRow('events','${ev.id}',loadEvents)">Excluir</button></div>`;
  });
}
async function addEvent(){
  const title = document.getElementById('e-title').value;
  const event_date = document.getElementById('e-date').value;
  const event_type = document.getElementById('e-type').value;
  const description = document.getElementById('e-desc').value;
  if(!title || !event_date) return alert('Preencha título e data');
  await sb.from('events').insert({ title, event_date, event_type, description });
  document.getElementById('e-title').value=''; document.getElementById('e-date').value=''; document.getElementById('e-desc').value='';
  loadEvents();
}

// ---- Mensagens ----
async function loadMessages(){
  const { data } = await sb.from('messages').select('*').order('created_at',{ascending:false});
  const el = document.getElementById('messages-list'); el.innerHTML = '';
  (data||[]).forEach(m=>{
    el.innerHTML += `<div class="item ${m.read?'':'unread'}"><div><b>${m.subject||m.kind}</b><small>${m.name||'Anônimo'}: ${m.body}</small></div><button class="btn-out" onclick="markRead('${m.id}')">${m.read?'Lida':'Marcar lida'}</button></div>`;
  });
}
async function markRead(id){
  await sb.from('messages').update({read:true}).eq('id', id);
  loadMessages();
}

async function delRow(table, id, reload){
  if(!confirm('Excluir este item?')) return;
  await sb.from(table).delete().eq('id', id);
  reload();
}

// Checa sessão ao carregar
sb.auth.getSession().then(({data})=>{ if(data.session) enterApp(); });
</script>
</body>
</html>
